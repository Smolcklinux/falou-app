name: Build Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: 🔧 Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          accept-android-sdk-licenses: true

      - name: 🔑 Criar local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      - name: 🏗️ Dar permissão ao Gradle
        run: chmod +x android/gradlew

      - name: 🧹 Limpar build anterior
        run: cd android && ./gradlew clean && cd ..

      - name: 🔨 Build APK de Debug
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🔨 Build APK de Release (se keystore configurado)
        run: cd android && ./gradlew assembleRelease --no-daemon --stacktrace || echo "Release build ignorado (keystore não configurado)"

      - name: 📤 Upload APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: falou-app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 📤 Upload APK Release (se existir)
        uses: actions/upload-artifact@v4
        with:
          name: falou-app-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
