name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Checkout do código
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true

      - name: 🔧 Configurar ANDROID_HOME
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: 💾 Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 💾 Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: 📦 Instalar dependências
        run: npm install --legacy-peer-deps

      - name: ⚡ CORREÇÃO DEFINITIVA do Kotlin (substitui build.gradle do expo-modules-core)
        run: |
          # Localizar o arquivo build.gradle do expo-modules-core
          MODULE_CORE_PATH=$(find node_modules/expo-modules-core -name "build.gradle" | head -1)
          echo "📁 Arquivo encontrado: $MODULE_CORE_PATH"

          # Substituir o conteúdo para forçar Kotlin 1.9.24 e suprimir a verificação
          cat > "$MODULE_CORE_PATH" << 'EOF'
          buildscript {
              ext.kotlin_version = '1.9.24'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          apply plugin: 'com.android.library'
          apply plugin: 'kotlin-android'

          android {
              compileSdkVersion 35
              namespace "expo.modules.core"
              defaultConfig {
                  minSdkVersion 24
                  targetSdkVersion 35
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_17.toString()
                  freeCompilerArgs += ["-Xskip-metadata-version-check"]
              }
          }

          dependencies {
              implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
              implementation 'androidx.annotation:annotation:1.7.0'
          }
          EOF

          echo "✅ Arquivo build.gradle do expo-modules-core sobrescrito com sucesso!"

      - name: 🔧 Configurar o build.gradle principal e gradle.properties
        run: |
          cat > android/build.gradle << 'EOF'
          buildscript {
              ext {
                  buildToolsVersion = "34.0.0"
                  minSdkVersion = 24
                  compileSdkVersion = 35
                  targetSdkVersion = 35
                  ndkVersion = "26.1.10909125"
                  kotlinVersion = "1.9.24"
              }
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath("com.android.tools.build:gradle:8.6.0")
                  classpath("com.facebook.react:react-native-gradle-plugin")
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24")
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.version=1.9.24
          android.suppressKotlinVersionCompatibilityCheck=true
          EOF

          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: 🏗️ Prebuild e Build do APK
        run: |
          npx expo prebuild --platform android --clean
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📤 Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: falou-app-release
          path: android/app/build/outputs/apk/release/*.apk